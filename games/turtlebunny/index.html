<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Shelly &amp; Hop — a nibbling adventure</title>
<style>
  :root{
    --ui-cream:#fff7ec;
    --ui-shadow:rgba(60,45,70,.22);
    --ui-press:#ffe2b8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;
    font-family:"Segoe UI Rounded","Trebuchet MS",Verdana,sans-serif;
    touch-action:none;user-select:none;-webkit-user-select:none}
  #c{position:fixed;inset:0;display:block}

  /* ---- score bubble ---- */
  #score{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:50%;transform:translateX(-50%);
    display:flex;gap:14px;padding:8px 16px;border-radius:999px;
    background:rgba(255,247,236,.82);box-shadow:0 4px 0 var(--ui-shadow);
    font-size:17px;font-weight:700;color:#5a4a3a;white-space:nowrap}
  #score span{display:inline-flex;align-items:center;gap:5px}
  .pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}

  /* ---- touch controls ---- */
  .pad{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;gap:12px;z-index:5}
  #padL{left:16px}
  #padR{right:16px}
  button.k{
    width:74px;height:74px;border:none;border-radius:26px;
    background:var(--ui-cream);color:#6b5744;
    box-shadow:0 5px 0 var(--ui-shadow);
    font-size:30px;line-height:1;display:flex;align-items:center;justify-content:center;
    transition:transform .06s,box-shadow .06s,background .06s;
  }
  button.k.down{transform:translateY(5px);box-shadow:0 0 0 var(--ui-shadow);background:var(--ui-press)}
  button.k.wide{width:92px;font-size:17px;font-weight:800;flex-direction:column;gap:2px}
  button.k .sub{font-size:11px;font-weight:700;opacity:.65}
  @media (max-width:380px){button.k{width:64px;height:64px;border-radius:22px;font-size:26px}button.k.wide{width:80px}}
  @media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="score">
  <span id="sGrass">🌿 0</span>
  <span id="sWeed">🌊 0</span>
</div>

<div class="pad" id="padL">
  <button class="k" id="bL" aria-label="Move left">◀</button>
  <button class="k" id="bR" aria-label="Move right">▶</button>
</div>
<div class="pad" id="padR">
  <button class="k wide" id="bU" aria-label="Hop or swim up">⬆<span class="sub">hop</span></button>
  <button class="k wide" id="bM" aria-label="Munch">😋<span class="sub">munch</span></button>
</div>

<script>
"use strict";
const cv=document.getElementById('c'), ctx=cv.getContext('2d');

/* ---------------- world ---------------- */
const VH=640;              // world units tall (always visible)
const WORLD_W=3000;
const WATER_Y=384;         // water surface
let VW=1000, scale=1;

function resize(){
  const w=innerWidth, h=innerHeight, dpr=Math.min(devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr); cv.height=Math.round(h*dpr);
  cv.style.width=w+'px'; cv.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  scale=h/VH; VW=w/scale;
}
addEventListener('resize',resize); resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function smooth(t){t=clamp(t,0,1);return t*t*(3-2*t);}

// ground profile: deep sea -> slope -> rolling meadow
function groundY(x){
  if(x<520) return 556 + Math.sin(x*0.011)*10;
  if(x<1460){
    const s=smooth((x-520)/940);
    return lerp(556+Math.sin(520*0.011)*10, 262, s);
  }
  return 262 - Math.sin((x-1460)*0.0032)*22 - Math.sin((x-1460)*0.0091)*9;
}
// shoreline (where ground meets the water surface)
let SHORE=0;
{ let lo=520, hi=1460;
  for(let i=0;i<40;i++){const m=(lo+hi)/2; if(groundY(m)>WATER_Y) lo=m; else hi=m;}
  SHORE=(lo+hi)/2;
}

/* ---------------- plants ---------------- */
const plants=[];
for(let x=70;x<WORLD_W-60;x+=52+Math.random()*26){
  const gy=groundY(x), sea=gy>WATER_Y;
  plants.push({
    x, y:gy, sea,
    grow:0.45+Math.random()*0.55,
    rate:0.085+Math.random()*0.05,
    h:(sea?54:32)+Math.random()*(sea?46:16),
    seed:Math.random()*99,
    blades:3+((Math.random()*3)|0),
    wob:0
  });
}

/* ---------------- decor ---------------- */
const clouds=[]; for(let i=0;i<9;i++)clouds.push({x:Math.random()*WORLD_W,y:40+Math.random()*130,s:.6+Math.random()*.9,v:.08+Math.random()*.12});
const fishes=[]; for(let i=0;i<7;i++){const x=60+Math.random()*(SHORE-140);fishes.push({x,y:WATER_Y+40+Math.random()*(groundY(x)-WATER_Y-70),v:(Math.random()<.5?-1:1)*(.35+Math.random()*.5),s:.7+Math.random()*.6,c:['#ffb35c','#ff8fa8','#ffd76e','#8fd4ff'][(Math.random()*4)|0],seed:Math.random()*9});}
const flitters=[]; for(let i=0;i<6;i++){const x=SHORE+120+Math.random()*(WORLD_W-SHORE-200);flitters.push({x,y:groundY(x)-90-Math.random()*90,seed:Math.random()*9,c:['#ffd0e6','#fff3a8','#d9c4ff'][(Math.random()*3)|0]});}
const shells=[]; for(let i=0;i<16;i++){const x=Math.random()*(SHORE+120);shells.push({x,y:groundY(x)-3,r:Math.random()*6.283,t:(Math.random()*3)|0,s:.7+Math.random()*.6});}
const rocks=[]; for(let i=0;i<12;i++){const x=Math.random()*WORLD_W;rocks.push({x,y:groundY(x),s:.6+Math.random()*.9,f:Math.random()});}

/* ---------------- player ---------------- */
const P={x:280,y:groundY(280)-30,vx:0,vy:0,face:1,onGround:false,
         sea:true,pop:0,munch:0,chew:0,hopT:0,paddle:0,blink:0,blinkT:2};
let grassEaten=0, weedEaten=0;
const parts=[];
function puff(x,y,n,opt){
  opt=opt||{};
  for(let i=0;i<n;i++){
    const a=Math.random()*6.283, sp=(opt.sp||1)*(.5+Math.random());
    parts.push({x,y,vx:Math.cos(a)*sp*(opt.wide||1),vy:Math.sin(a)*sp-(opt.up||0),
      life:1,decay:.012+Math.random()*.02,r:(opt.r||5)*(.6+Math.random()*.8),
      c:opt.c||'#fff',g:opt.g||0,kind:opt.kind||'dot'});
  }
}

/* ---------------- input ---------------- */
const K={l:false,r:false,u:false,m:false};
function bind(id,key){
  const el=document.getElementById(id);
  const on=e=>{e.preventDefault();K[key]=true;el.classList.add('down');};
  const off=e=>{e.preventDefault();K[key]=false;el.classList.remove('down');};
  el.addEventListener('pointerdown',on);
  el.addEventListener('pointerup',off);
  el.addEventListener('pointercancel',off);
  el.addEventListener('pointerleave',off);
  el.addEventListener('contextmenu',e=>e.preventDefault());
}
bind('bL','l');bind('bR','r');bind('bU','u');bind('bM','m');
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')K.l=true;
  else if(k==='arrowright'||k==='d')K.r=true;
  else if(k==='arrowup'||k==='w'||k===' ')K.u=true;
  else if(k==='e'||k==='arrowdown'||k==='s')K.m=true; else return;
  e.preventDefault();
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a')K.l=false;
  else if(k==='arrowright'||k==='d')K.r=false;
  else if(k==='arrowup'||k==='w'||k===' ')K.u=false;
  else if(k==='e'||k==='arrowdown'||k==='s')K.m=false;
});

/* ---------------- munching ---------------- */
const sGrass=document.getElementById('sGrass'), sWeed=document.getElementById('sWeed');
function bump(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');}
let munchLock=0;
function tryMunch(){
  if(munchLock>0) return;
  let best=null,bd=1e9;
  for(const p of plants){
    if(p.grow<0.3) continue;
    const dx=Math.abs(p.x-P.x), dy=Math.abs((p.y-p.h*p.grow*0.5)-P.y);
    if(dx<64 && dy<110){const d=dx+dy*.4; if(d<bd){bd=d;best=p;}}
  }
  P.munch=0.42; P.chew=0.6; munchLock=0.3;
  if(best){
    best.grow=0; best.wob=1;
    if(best.sea){weedEaten++;sWeed.textContent='🌊 '+weedEaten;bump(sWeed);
      puff(best.x,best.y-20,10,{c:'#8fe0b8',sp:1.3,up:.6,r:4});}
    else{grassEaten++;sGrass.textContent='🌿 '+grassEaten;bump(sGrass);
      puff(best.x,best.y-14,10,{c:'#9be07f',sp:1.3,up:.6,r:4,g:.06});}
    for(let i=0;i<5;i++)puff(P.x+ (Math.random()*30-15), P.y-34,1,{c:'#fff0a8',sp:.7,up:1,r:3,kind:'star'});
  }
}

/* ---------------- update ---------------- */
let last=performance.now(), tAcc=0;
function update(dt){
  const k=dt*60; // frame-normalised
  tAcc+=dt;
  munchLock=Math.max(0,munchLock-dt);
  P.munch=Math.max(0,P.munch-dt); P.chew=Math.max(0,P.chew-dt);
  P.pop=Math.max(0,P.pop-dt*2.4); P.hopT=Math.max(0,P.hopT-dt*2);
  P.blinkT-=dt; if(P.blinkT<=0){P.blink=0.14;P.blinkT=2.2+Math.random()*3;}
  P.blink=Math.max(0,P.blink-dt);

  const wasSea=P.sea;
  const gy=groundY(P.x);
  P.sea = P.y > WATER_Y+4;

  if(P.sea){
    /* swim */
    const acc=0.42*k, maxv=3.1;
    if(K.l){P.vx-=acc;P.face=-1}
    if(K.r){P.vx+=acc;P.face=1}
    P.vx=clamp(P.vx,-maxv,maxv);
    if(!K.l&&!K.r)P.vx*=Math.pow(0.86,k);
    if(K.u)P.vy-=0.5*k; else P.vy+=0.12*k;      // gentle sink
    P.vy=clamp(P.vy,-4.2,2.4);
    P.vy*=Math.pow(0.95,k);
    P.paddle+=dt*(2.5+Math.abs(P.vx)*1.6);
    if(Math.random()<0.05)puff(P.x-P.face*22,P.y-6,1,{c:'rgba(255,255,255,.7)',sp:.15,up:.5,r:3,kind:'bub'});
  }else{
    /* hop */
    const acc=0.5*k, maxv=3.9;
    if(K.l){P.vx-=acc;P.face=-1}
    if(K.r){P.vx+=acc;P.face=1}
    P.vx=clamp(P.vx,-maxv,maxv);
    if(!K.l&&!K.r)P.vx*=Math.pow(P.onGround?0.78:0.96,k);
    P.vy+=0.52*k;
    if(P.onGround&&K.u){P.vy=-10.2;P.onGround=false;P.hopT=1;
      puff(P.x,P.y+26,6,{c:'#e8dcc0',sp:.9,up:.3,r:4,g:.1});}
    // auto-hop bounce while running
    if(P.onGround&&Math.abs(P.vx)>0.6){P.vy=-4.6;P.onGround=false;}
  }

  P.x=clamp(P.x+P.vx*k,30,WORLD_W-30);
  P.y+=P.vy*k;

  // ground collision
  const g2=groundY(P.x)-26;
  if(P.y>g2){
    P.y=g2;
    if(P.sea){P.vy=Math.min(P.vy,0)*0.3;}
    else{ if(P.vy>3)puff(P.x,P.y+26,5,{c:'#e8dcc0',sp:.8,r:4,g:.1});
          P.vy=0;P.onGround=true; }
  } else if(!P.sea) P.onGround=false;

  if(P.y<60){P.y=60;P.vy=Math.max(P.vy,0);}

  // splash on crossing the surface
  if(wasSea!==P.sea){
    P.pop=1;
    const sx=P.x;
    puff(sx,WATER_Y,18,{c:'rgba(255,255,255,.95)',sp:2.2,up:1.6,r:6,g:.14,kind:'drop'});
    puff(sx,WATER_Y,10,{c:'rgba(150,225,255,.9)',sp:1.6,up:1.2,r:7,g:.12,kind:'drop'});
  }

  if(K.m)tryMunch();

  // plants regrow
  for(const p of plants){
    if(p.grow<1)p.grow=Math.min(1,p.grow+p.rate*dt);
    p.wob*=Math.pow(0.02,dt);
  }
  // particles
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i];
    q.x+=q.vx*k; q.y+=q.vy*k; q.vy+=q.g*k; q.vx*=Math.pow(.97,k);
    q.life-=q.decay*k*1.6;
    if(q.life<=0)parts.splice(i,1);
  }
  for(const f of fishes){
    f.x+=f.v*k*.9;
    const lim=SHORE-40;
    if(f.x<50){f.x=50;f.v*=-1}
    if(f.x>lim){f.x=lim;f.v*=-1}
    const fl=groundY(f.x)-24;
    if(f.y>fl)f.y=fl;
  }
  for(const c of clouds){c.x-=c.v*k*.4; if(c.x<-200)c.x=WORLD_W+150;}
}

/* ---------------- drawing helpers ---------------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function ell(x,y,rx,ry,rot){ctx.beginPath();ctx.ellipse(x,y,rx,ry,rot||0,0,6.2832);ctx.fill();}

function drawSky(){
  const g=ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#8fd8f7');g.addColorStop(.45,'#c6ecfb');g.addColorStop(1,'#f4fbe8');
  ctx.fillStyle=g;ctx.fillRect(0,0,VW+4,VH);
  // sun
  ctx.fillStyle='rgba(255,247,200,.85)';ell(VW*0.78,96,52,52);
  ctx.fillStyle='rgba(255,252,225,.55)';ell(VW*0.78,96,78,78);
}
function drawCloud(x,y,s){
  ctx.fillStyle='rgba(255,255,255,.92)';
  ell(x,y,44*s,24*s); ell(x-34*s,y+8*s,28*s,17*s); ell(x+34*s,y+7*s,32*s,19*s);
  ctx.fillStyle='rgba(214,238,250,.9)';
  ell(x+4*s,y+16*s,52*s,10*s);
}
function hills(camX){
  // far hills (parallax)
  ctx.save();ctx.translate(-camX*0.25,0);
  ctx.fillStyle='#a9dcb4';
  for(let i=-1;i<12;i++){const x=i*420+60;ctx.beginPath();ctx.ellipse(x,318,240,120,0,Math.PI,0);ctx.fill();}
  ctx.restore();
  ctx.save();ctx.translate(-camX*0.45,0);
  ctx.fillStyle='#8ccf9c';
  for(let i=-1;i<14;i++){const x=i*330+180;ctx.beginPath();ctx.ellipse(x,342,180,96,0,Math.PI,0);ctx.fill();}
  ctx.restore();
}

function groundTop(from,to,step){
  ctx.beginPath();
  ctx.moveTo(from,groundY(from));
  for(let x=from+step;x<=to;x+=step)ctx.lineTo(x,groundY(x));
  ctx.lineTo(to,groundY(to));
}
function drawGround(from,to){
  const step=8;
  groundTop(from,to,step);
  ctx.lineTo(to,VH+40);ctx.lineTo(from,VH+40);ctx.closePath();
  const g=ctx.createLinearGradient(0,200,0,VH);
  g.addColorStop(0,'#c99a63');g.addColorStop(.5,'#a97a4d');g.addColorStop(1,'#8a5f3c');
  ctx.fillStyle=g;ctx.fill();

  // top surface band = the 2.5D "lip"
  for(let x=from;x<=to;x+=step){
    const y=groundY(x), sea=y>WATER_Y;
    const h=sea?16:20;
    const y2=groundY(Math.min(x+step,to));
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+step,y2);ctx.lineTo(x+step,y2+h);ctx.lineTo(x,y+h);ctx.closePath();
    ctx.fillStyle=sea?'#f2ddad':'#7fd06f';
    ctx.fill();
    ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+step,y2);ctx.lineTo(x+step,y2+6);ctx.lineTo(x,y+6);ctx.closePath();
    ctx.fillStyle=sea?'#fbeecb':'#a3e58c';
    ctx.fill();
  }
  // pebbles + shells + rocks
  for(const r of rocks){
    if(r.x<from-60||r.x>to+60)continue;
    ctx.fillStyle=groundY(r.x)>WATER_Y?'#b9a488':'#9c8f7d';
    ell(r.x,r.y+14*r.s,15*r.s,9*r.s);
    ctx.fillStyle='rgba(255,255,255,.35)';ell(r.x-3*r.s,r.y+10*r.s,8*r.s,4*r.s);
  }
  for(const s of shells){
    if(s.x<from-40||s.x>to+40)continue;
    ctx.save();ctx.translate(s.x,s.y+9);ctx.rotate(Math.sin(s.r)*.4);ctx.scale(s.s,s.s);
    ctx.fillStyle=['#ffd9e2','#ffe9c9','#dcd2ff'][s.t];
    ctx.beginPath();ctx.moveTo(0,4);ctx.quadraticCurveTo(-11,-6,0,-8);ctx.quadraticCurveTo(11,-6,0,4);ctx.fill();
    ctx.restore();
  }
}

function drawSeaweed(p,t){
  const g=p.grow; if(g<=0.02)return;
  const H=p.h*g, sway=Math.sin(t*1.5+p.seed)*0.35;
  for(let b=0;b<3;b++){
    const off=(b-1)*9, w=(9-b*1.5)*Math.min(1,g+.2);
    const tipX=p.x+off+Math.sin(t*1.6+p.seed+b)*14*g;
    ctx.beginPath();
    ctx.moveTo(p.x+off-w*.5,p.y+4);
    ctx.quadraticCurveTo(p.x+off+sway*20-w*.5, p.y-H*.55, tipX-w*.2, p.y-H);
    ctx.quadraticCurveTo(p.x+off+sway*20+w*.6, p.y-H*.55, p.x+off+w*.5, p.y+4);
    ctx.closePath();
    ctx.fillStyle=b===1?'#3fa87c':'#57c091';
    ctx.fill();
    if(b===1){ctx.fillStyle='rgba(180,255,220,.4)';
      ctx.beginPath();ctx.moveTo(p.x+off-1,p.y+2);
      ctx.quadraticCurveTo(p.x+off+sway*18,p.y-H*.55,tipX,p.y-H*.9);
      ctx.lineTo(p.x+off+2,p.y+2);ctx.fill();}
  }
  if(g>0.92){ctx.fillStyle='#ffd7f0';ell(p.x+Math.sin(t*1.6+p.seed)*12,p.y-H-4,5,5);}
}
function drawGrass(p,t){
  const g=p.grow; if(g<=0.02)return;
  const H=p.h*g;
  ctx.fillStyle='rgba(60,110,50,.13)';ell(p.x,p.y+11,16,5);
  for(let b=0;b<p.blades;b++){
    const off=(b-(p.blades-1)/2)*7;
    const bend=Math.sin(t*1.1+p.seed+b*.8)*7*g + off*0.9;
    const h=H*(0.75+0.25*Math.cos(b*1.7+p.seed));
    ctx.beginPath();
    ctx.moveTo(p.x+off-4,p.y+6);
    ctx.quadraticCurveTo(p.x+off-2+bend*.4, p.y-h*.6, p.x+off+bend, p.y-h);
    ctx.quadraticCurveTo(p.x+off+3+bend*.4, p.y-h*.6, p.x+off+4,p.y+6);
    ctx.closePath();
    ctx.fillStyle=b%2?'#5cb84f':'#74d063';
    ctx.fill();
  }
  if(g>0.95){
    const fx=p.x+Math.sin(t*1.1+p.seed)*5, fy=p.y-H-3;
    ctx.fillStyle=['#ffd6e7','#fff2a6','#e3d2ff'][p.seed%3|0];
    for(let i=0;i<5;i++){const a=i*1.2566+t*.2;ell(fx+Math.cos(a)*5,fy+Math.sin(a)*5,3.6,3.6);}
    ctx.fillStyle='#ffb84d';ell(fx,fy,2.6,2.6);
  }
}

/* --- characters --- */
function drawShadow(x,y){ctx.fillStyle='rgba(70,55,40,.16)';ell(x,y,26,8);}

function drawTurtle(t){
  const s=1+P.pop*0.18, sq=1-P.pop*0.15;
  ctx.save();
  ctx.translate(P.x,P.y);
  ctx.rotate(clamp(P.vy*0.03,-.25,.25));
  ctx.scale(P.face*s,sq);
  const pad=Math.sin(P.paddle*3)*0.6;
  // back flippers
  ctx.fillStyle='#7fd8c0';
  ell(-26,10,14,7,-0.5+pad*.2);
  // front flipper (far)
  ctx.fillStyle='#6ec7b0';
  ell(14,14,16,8,0.7+pad*.5);
  // body/head
  ctx.fillStyle='#8fe3ca';
  ell(0,4,30,21);
  ctx.fillStyle='#8fe3ca';
  ell(28,-4,15,13);                    // head
  // shell
  ctx.fillStyle='#3f9c6d';
  ctx.beginPath();ctx.ellipse(-2,-6,31,22,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#4fb47e';
  ctx.beginPath();ctx.ellipse(-2,-4,31,22,0,Math.PI,0);ctx.fill();
  ctx.fillStyle='#79d09b';
  for(const[dx,dy,r]of[[-16,-12,7],[-2,-16,8],[14,-11,7],[-9,-3,6],[6,-3,6]]) ell(dx,dy,r,r*0.8);
  ctx.fillStyle='rgba(255,255,255,.35)';ell(-14,-16,10,5,-0.4);
  // shell rim
  ctx.strokeStyle='#e9f7c9';ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.ellipse(-2,-2,31,20,0,Math.PI,0);ctx.stroke();
  // front flipper (near)
  ctx.fillStyle='#8fe3ca';
  ell(16,12,18,8.5,0.55+pad*.6);
  // face
  ctx.fillStyle='#ffb3c7';ell(34,1,5,3.5);
  ctx.fillStyle='#3d3547';
  if(P.blink>0){ctx.fillRect(31,-7,7,2.4);}else{ell(34,-6,3.4,3.8);}
  ctx.fillStyle='#fff';if(P.blink<=0)ell(35.2,-7.2,1.3,1.4);
  // mouth
  ctx.strokeStyle='#3d3547';ctx.lineWidth=2;
  ctx.beginPath();
  const open=P.chew>0?2.2+Math.sin(t*26)*1.8:0;
  if(open>0.4){ctx.ellipse(38,1.5,3,1+open*.7,0,0,6.283);ctx.fillStyle='#e0698a';ctx.fill();}
  else{ctx.moveTo(36,1);ctx.quadraticCurveTo(39,3.4,41,1);ctx.stroke();}
  ctx.restore();
}

function drawBunny(t){
  const air=!P.onGround;
  const sq = P.onGround ? 1-Math.min(.16,Math.max(0,-P.vy*0)) : 1;
  const stretch = air? clamp(1+ -P.vy*0.018,0.88,1.16) : 1;
  ctx.save();
  ctx.translate(P.x,P.y);
  ctx.scale(P.face*(1/stretch)*(1+P.pop*.15), stretch*(1-P.pop*.12)*sq);
  const legUp=air?1:0;
  // back foot
  ctx.fillStyle='#f0e2d4'; ell(-16,20-legUp*6,13,7,legUp*-0.4);
  // tail
  ctx.fillStyle='#fff9f2'; ell(-26,2,10,10);
  // body
  ctx.fillStyle='#fdf3ea'; ell(-4,4,26,22);
  // ears
  const eb=Math.sin(t*2.2)*0.06 + (air?-0.25:0);
  for(const[dx,rot,sc]of[[6,-0.55+eb,.9],[14,-0.2+eb,1]]){
    ctx.save();ctx.translate(dx,-18);ctx.rotate(rot);ctx.scale(sc,sc);
    ctx.fillStyle='#fdf3ea';ell(0,-18,8,22);
    ctx.fillStyle='#ffbdd0';ell(0,-17,4.4,15);
    ctx.restore();
  }
  // head
  ctx.fillStyle='#fffaf3'; ell(15,-9,18,16);
  // cheek + face
  ctx.fillStyle='#ffcada'; ell(22,-3,6,4);
  ctx.fillStyle='#3d3547';
  if(P.blink>0)ctx.fillRect(19,-11,7,2.4); else {ell(22.5,-10,3.6,4);}
  if(P.blink<=0){ctx.fillStyle='#fff';ell(23.8,-11.4,1.4,1.5);}
  ctx.fillStyle='#ff9fb8';ell(30,-6,3.6,2.8);
  ctx.strokeStyle='#c98da0';ctx.lineWidth=1.6;ctx.lineCap='round';
  const open=P.chew>0?1+Math.abs(Math.sin(t*24))*3:0;
  ctx.beginPath();
  ctx.moveTo(30,-3.6);ctx.lineTo(30,-2.6+open*.4);
  ctx.moveTo(30,-2.4+open*.4);ctx.quadraticCurveTo(27.5,-0.6+open,26.4,-2.4+open*.5);
  ctx.moveTo(30,-2.4+open*.4);ctx.quadraticCurveTo(32.5,-0.6+open,33.6,-2.4+open*.5);
  ctx.stroke();
  // whiskers
  ctx.strokeStyle='rgba(190,170,160,.7)';ctx.lineWidth=1.2;
  ctx.beginPath();ctx.moveTo(29,-4);ctx.lineTo(38,-7);ctx.moveTo(29,-2);ctx.lineTo(38,-1);ctx.stroke();
  // front foot
  ctx.fillStyle='#fffaf3'; ell(10,20-legUp*8,10,6,legUp*0.5);
  ctx.restore();
}

/* --- water --- */
function waveY(x,t){return WATER_Y + Math.sin(x*0.018+t*1.4)*3.2 + Math.sin(x*0.041-t*2.1)*1.6;}
function drawWater(from,to,t){
  const right=Math.min(to,SHORE+6), left=from;
  if(right<=left)return;
  ctx.beginPath();
  ctx.moveTo(left,waveY(left,t));
  for(let x=left;x<=right;x+=10)ctx.lineTo(x,waveY(x,t));
  ctx.lineTo(right,groundY(right));
  for(let x=right;x>=left;x-=10)ctx.lineTo(x,groundY(x)+2);
  ctx.closePath();
  const g=ctx.createLinearGradient(0,WATER_Y,0,VH);
  g.addColorStop(0,'rgba(120,215,245,.42)');
  g.addColorStop(1,'rgba(40,140,205,.60)');
  ctx.fillStyle=g;ctx.fill();
  // light shafts
  ctx.save();ctx.clip();
  ctx.globalAlpha=.14;ctx.fillStyle='#fff';
  for(let i=0;i<9;i++){
    const x=((i*260 + Math.sin(t*.3+i)*40)%(SHORE+200));
    ctx.beginPath();ctx.moveTo(x,WATER_Y);ctx.lineTo(x+34,WATER_Y);ctx.lineTo(x+96,VH);ctx.lineTo(x+18,VH);ctx.closePath();ctx.fill();
  }
  ctx.restore();
  // surface line + foam
  ctx.beginPath();ctx.moveTo(left,waveY(left,t));
  for(let x=left;x<=right;x+=8)ctx.lineTo(x,waveY(x,t));
  ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=3.5;ctx.lineCap='round';ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.55)';
  for(let i=0;i<7;i++){
    const x=SHORE-14-i*22-Math.sin(t*1.3+i)*8;
    if(x<left-20)break;
    ell(x,waveY(x,t)+2,10-i,3.4);
  }
}

function drawParts(){
  for(const q of parts){
    ctx.globalAlpha=clamp(q.life,0,1);
    ctx.fillStyle=q.c;
    if(q.kind==='star'){
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.life*4);
      ctx.beginPath();
      for(let i=0;i<8;i++){const a=i*0.7854,r=i%2?q.r*.4:q.r;ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);}
      ctx.closePath();ctx.fill();ctx.restore();
    }else if(q.kind==='bub'){
      ctx.beginPath();ctx.arc(q.x,q.y,q.r,0,6.283);
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.4;ctx.stroke();
    }else{
      ell(q.x,q.y,q.r,q.r*(q.kind==='drop'?1.25:1));
    }
  }
  ctx.globalAlpha=1;
}

/* ---------------- main loop ---------------- */
function frame(now){
  let dt=(now-last)/1000; last=now;
  dt=Math.min(dt,0.05);
  update(dt);
  const t=tAcc;

  const camX=clamp(P.x-VW/2, 0, Math.max(0,WORLD_W-VW));
  const from=camX-80, to=camX+VW+80;

  ctx.setTransform(1,0,0,1,0,0);
  const dpr=Math.min(devicePixelRatio||1,2);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.save();
  ctx.scale(scale,scale);

  drawSky();
  ctx.save();ctx.translate(-camX*0.35,0);
  for(const c of clouds)drawCloud(c.x,c.y,c.s);
  ctx.restore();
  hills(camX);

  ctx.save();ctx.translate(-camX,0);

  drawGround(from,to);

  // seaweed & grass
  for(const p of plants){
    if(p.x<from-70||p.x>to+70)continue;
    if(p.sea)drawSeaweed(p,t);else drawGrass(p,t);
  }
  // fish (behind water tint)
  for(const f of fishes){
    if(f.x<from-60||f.x>to+60)continue;
    const bob=Math.sin(t*2+f.seed)*4;
    ctx.save();ctx.translate(f.x,f.y+bob);ctx.scale(f.v>0?f.s:-f.s,f.s);
    ctx.fillStyle=f.c;ell(0,0,13,8);
    ctx.beginPath();ctx.moveTo(-11,0);ctx.lineTo(-20,-7);ctx.lineTo(-20,7);ctx.closePath();ctx.fill();
    ctx.fillStyle='#3d3547';ell(5,-2,1.8,1.8);
    ctx.restore();
  }
  // butterflies
  for(const f of flitters){
    if(f.x<from-60||f.x>to+60)continue;
    const x=f.x+Math.sin(t*.8+f.seed)*40, y=f.y+Math.sin(t*1.7+f.seed)*16;
    const w=Math.abs(Math.sin(t*9+f.seed))*6+2;
    ctx.fillStyle=f.c;ell(x-4,y,w,6);ell(x+4,y,w,6);
    ctx.fillStyle='#7a6a5a';ell(x,y,2,4);
  }

  if(!P.sea)drawShadow(P.x,groundY(P.x)+8);
  if(P.sea)drawTurtle(t);else drawBunny(t);

  drawWater(from,to,t);
  drawParts();

  ctx.restore(); // camera
  ctx.restore(); // scale
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
