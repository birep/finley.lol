    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, p.radius, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#a8dcf0';
    ctx.beginPath();
    ctx.arc(pos.x - 1.5, pos.y - 1.5, p.radius * 0.35, 0, Math.PI * 2);
    ctx.fill();
  } else if (p.source === 'balloon') {
    ctx.fillStyle = '#1e6fb0';
    ctx.strokeStyle = '#0f4a7d';
    ctx.lineWidth = 2;
    // teardrop
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, p.radius, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
    // shine
    ctx.fillStyle = '#7ec8ff';
    ctx.beginPath();
    ctx.arc(pos.x - 2, pos.y - 2, p.radius * 0.4, 0, Math.PI * 2);
    ctx.fill();
    // tie knot
    ctx.fillStyle = '#0f4a7d';
    ctx.beginPath();
    ctx.arc(pos.x - p.radius * 0.3, pos.y + p.radius * 0.9, 2, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSandWall(w) {
  const hpFrac = w.hp / w.maxHp;
  // More dramatic size range: 14 when barely alive, 32 when fresh
  const size = 14 + hpFrac * 18;
  ctx.save();
  ctx.translate(w.x, w.y);

  // Shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
  ctx.beginPath();
  ctx.ellipse(2, 10, size * 1.2, 5, 0, 0, Math.PI * 2);
  ctx.fill();

  // Sand pile mound
  ctx.fillStyle = hpFrac > 0.33 ? '#f0cd78' : '#d4a855';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-size - 4, 8);
  ctx.quadraticCurveTo(-size * 0.5, -size * 1.3, 0, -size);
  ctx.quadraticCurveTo(size * 0.5, -size * 1.3, size + 4, 8);
  ctx.closePath();
  ctx.fill(); ctx.stroke();

  // Highlight
  ctx.fillStyle = 'rgba(255, 240, 180, 0.5)';
  ctx.beginPath();
  ctx.moveTo(-size * 0.6, 6);
  ctx.quadraticCurveTo(-size * 0.3, -size * 0.8, size * 0.1, -size * 0.6);
  ctx.quadraticCurveTo(-size * 0.2, -size * 0.3, -size * 0.5, 5);
  ctx.fill();

  // Sand grains
  ctx.fillStyle = '#c99842';
  ctx.beginPath(); ctx.arc(-size * 0.4, 0, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(size * 0.2, -size * 0.3, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(-size * 0.1, size * 0.2, 1, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(size * 0.4, 2, 1, 0, Math.PI * 2); ctx.fill();

  // Small HP pips on top of the mound (each wall starts with 6 pips)
  if (w.maxHp > 1 && hpFrac < 0.95) {
    const pipR = 1.6;
    const pipsLeft = Math.ceil(w.hp);
    for (let i = 0; i < pipsLeft; i++) {
      const px = (i - (pipsLeft - 1)/2) * 5;
      ctx.fillStyle = '#3a2a1a';
      ctx.beginPath();
      ctx.arc(px, -size - 4, pipR, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  ctx.restore();
}

function drawBigWave() {
  if (!state.bigWave) return;
  const progress = state.bigWave.progress;
  const currentDist = progress * PATH_TOTAL;

  // Draw wave surge following the path
  ctx.save();

  // Wave body — thick water column along the path behind the front
  const tailLength = 80;
  const startDist = Math.max(0, currentDist - tailLength);
  ctx.strokeStyle = 'rgba(15, 74, 125, 0.8)';
  ctx.lineWidth = 80;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.beginPath();
  let first = true;
  for (let d = startDist; d <= Math.min(currentDist, PATH_TOTAL); d += 8) {
    const p = pointOnPath(d);
    if (first) { ctx.moveTo(p.x, p.y); first = false; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // Inner lighter
  ctx.strokeStyle = 'rgba(43, 143, 214, 0.85)';
  ctx.lineWidth = 66;
  ctx.beginPath();
  first = true;
  for (let d = startDist; d <= Math.min(currentDist, PATH_TOTAL); d += 8) {
    const p = pointOnPath(d);
    if (first) { ctx.moveTo(p.x, p.y); first = false; }
    else ctx.lineTo(p.x, p.y);
  }
  ctx.stroke();

  // Foam at front
  const front = pointOnPath(Math.min(currentDist, PATH_TOTAL));
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#0f4a7d';
  ctx.lineWidth = 2;
  for (let i = 0; i < 8; i++) {
    const a = Math.random() * Math.PI * 2;
    const rad = 30 + Math.random() * 20;
    ctx.beginPath();
    ctx.arc(front.x + Math.cos(a) * rad * 0.5, front.y + Math.sin(a) * rad * 0.5,
      6 + Math.random() * 6, 0, Math.PI * 2);
    ctx.fill();
  }

  // HP indicator
  const hp = state.bigWave.hp;
  const maxHp = state.bigWave.maxHp;
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#0f4a7d';
  ctx.lineWidth = 2;
  ctx.font = 'bold 20px Chewy';
  ctx.textAlign = 'center';
  ctx.strokeText('POWER: ' + hp, front.x, front.y - 50);
  ctx.fillText('POWER: ' + hp, front.x, front.y - 50);

  ctx.restore();
}

function drawBigWaveWarning() {
  if (state.bigWaveWarning <= 0) return;
  state.bigWaveWarning -= 1/60;
  const flash = Math.sin(state.time * 10) * 0.5 + 0.5;
  ctx.fillStyle = 'rgba(226, 62, 62, ' + (0.25 * flash) + ')';
  ctx.fillRect(0, 0, W, 180);

  // Red arrow warnings along the path
  ctx.fillStyle = 'rgba(226, 62, 62, ' + flash + ')';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2;
  ctx.font = 'bold 30px Chewy';
  ctx.textAlign = 'center';
  ctx.strokeText('BIG WAVE!', 350, 100);
  ctx.fillText('BIG WAVE!', 350, 100);
}

function drawHover() {
  if (!state.hover) return;
  if (state.hover.type === 'spot') {
    const s = state.hover.spot;
    const def = TOWERS[state.selectedTool];
    // Range preview
    if (def && def.range > 0) {
      ctx.strokeStyle = 'rgba(34, 197, 94, 0.8)';
      ctx.lineWidth = 2;
      ctx.setLineDash([5, 4]);
      ctx.beginPath();
      ctx.arc(s.x, s.y, def.range, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = 'rgba(34, 197, 94, 0.1)';
      ctx.beginPath();
      ctx.arc(s.x, s.y, def.range, 0, Math.PI * 2);
      ctx.fill();
    }
    // Highlight square
    ctx.strokeStyle = s.occupied ? '#e23e3e' : '#22c55e';
    ctx.lineWidth = 3;
    ctx.strokeRect(s.x - 24, s.y - 24, 48, 48);
    // Ghost tower
    if (!s.occupied && def && state.coins >= def.cost) {
      ctx.globalAlpha = 0.6;
      const temp = {
        x: s.x, y: s.y, type: state.selectedTool,
        angle: -Math.PI/2, bob: 0, fireAnim: 0, generateT: 0,
        charge: 0, target: null, level: 0,
        range: (TOWERS[state.selectedTool] && TOWERS[state.selectedTool].levels) ? (TOWERS[state.selectedTool].levels[0].range || 0) : 0,
        stats: () => TOWERS[state.selectedTool].levels[0],
      };
      ctx.save();
      ctx.translate(s.x, s.y);
      if (state.selectedTool === 'squirt') drawSquirtGun(temp);
      else if (state.selectedTool === 'balloon') drawBalloonLauncher(temp);
      else if (state.selectedTool === 'sniper') drawSniper(temp);
      else if (state.selectedTool === 'radar') drawRadar(temp);
      else if (state.selectedTool === 'shovel') drawShovel(temp);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  } else if (state.hover.type === 'sand') {
    ctx.fillStyle = 'rgba(240, 205, 120, 0.6)';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(state.hover.x, state.hover.y, 20, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }
}

function drawSelectedTower() {
  const t = state.selectedTower;
  if (!t) return;
  const def = TOWERS[t.type];

  // Range circle (if the tower has one) — use the tower's actual leveled range
  if (t.range > 0) {
    ctx.strokeStyle = 'rgba(58, 42, 26, 0.7)';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.fill();
  }

  // Pulsing ring around tower
  const pulse = 0.5 + Math.sin(state.time * 6) * 0.25;
  ctx.strokeStyle = 'rgba(255, 107, 71, ' + pulse + ')';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(t.x, t.y, 28, 0, Math.PI * 2);
  ctx.stroke();

  // Level pips next to tower
  const maxLv = def.levels.length;
  for (let i = 0; i < maxLv; i++) {
    const px = t.x - ((maxLv - 1) * 6) / 2 + i * 6;
    const py = t.y + 22;
    ctx.fillStyle = i <= t.level ? '#ffcc33' : 'rgba(255, 255, 255, 0.5)';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    ctx.arc(px, py, 3, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  }

  // Upgrade button (above tower) — BIG for kid fingers
  if (t.canUpgrade()) {
    const ub = getUpgradeButtonBounds(t);
    const cost = t.nextCost();
    const affordable = state.coins >= cost;
    // Drop shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
    ctx.beginPath();
    ctx.roundRect(ub.x + 3, ub.y + 4, ub.w, ub.h, 18);
    ctx.fill();
    // Body
    ctx.fillStyle = affordable ? '#4ade80' : '#b4bab5';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(ub.x, ub.y, ub.w, ub.h, 18);
    ctx.fill(); ctx.stroke();
    // Up-arrow icon on the left
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2;
    const ax = ub.x + 18, ay = ub.y + ub.h / 2;
    ctx.beginPath();
    ctx.moveTo(ax, ay - 8);
    ctx.lineTo(ax + 8, ay);
    ctx.lineTo(ax + 3, ay);
    ctx.lineTo(ax + 3, ay + 8);
    ctx.lineTo(ax - 3, ay + 8);
    ctx.lineTo(ax - 3, ay);
    ctx.lineTo(ax - 8, ay);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
    // Label
    ctx.fillStyle = '#fff';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2.5;
    ctx.font = 'bold 19px Chewy';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText('UPGRADE ' + cost, ub.x + ub.w/2 + 10, ub.y + ub.h/2 + 1);
    ctx.fillText('UPGRADE ' + cost, ub.x + ub.w/2 + 10, ub.y + ub.h/2 + 1);
    ctx.textBaseline = 'alphabetic';
    // Arrow from button to tower
    ctx.fillStyle = affordable ? '#4ade80' : '#b4bab5';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(t.x - 8, ub.y + ub.h);
    ctx.lineTo(t.x + 8, ub.y + ub.h);
    ctx.lineTo(t.x, ub.y + ub.h + 10);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  } else {
    // MAX level badge
    ctx.fillStyle = '#ffcc33';
    ctx.strokeStyle = '#3a2a1a';
    ctx.lineWidth = 2.5;
    ctx.font = 'bold 18px Chewy';
    ctx.textAlign = 'center';
    ctx.strokeText('MAX LEVEL', t.x, t.y - 48);
    ctx.fillText('MAX LEVEL', t.x, t.y - 48);
  }

  // Sell button (below tower)
  const sb = getSellButtonBounds(t);
  const invested = t.invested || TOWERS[t.type].cost;
  const refund = Math.ceil(invested * 0.6);

  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.roundRect(sb.x + 3, sb.y + 4, sb.w, sb.h, 18);
  ctx.fill();
  ctx.fillStyle = '#e23e3e';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(sb.x, sb.y, sb.w, sb.h, 18);
  ctx.fill(); ctx.stroke();
  // Hammer icon on the left
  ctx.save();
  ctx.translate(sb.x + 18, sb.y + sb.h / 2);
  ctx.fillStyle = '#b8c8d8';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(-9, -7, 18, 7, 1.5);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#c99842';
  ctx.beginPath();
  ctx.roundRect(-2, 0, 4, 11, 1);
  ctx.fill(); ctx.stroke();
  ctx.restore();
  // Label
  ctx.fillStyle = '#fff';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2.5;
  ctx.font = 'bold 19px Chewy';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.strokeText('SELL +' + refund, sb.x + sb.w/2 + 10, sb.y + sb.h/2 + 1);
  ctx.fillText('SELL +' + refund, sb.x + sb.w/2 + 10, sb.y + sb.h/2 + 1);
  ctx.textBaseline = 'alphabetic';

  // Arrow from tower up to sell button
  ctx.fillStyle = '#e23e3e';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(t.x - 8, sb.y);
  ctx.lineTo(t.x + 8, sb.y);
  ctx.lineTo(t.x, sb.y - 10);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
}

// Faint range rings under every weapon tower, always visible
function drawAllRanges() {
  for (const t of state.towers) {
    if (t.range <= 0) continue;
    if (t === state.selectedTower) continue; // the selected one gets its own stronger ring
    let color;
    if (t.type === 'radar') color = 'rgba(34, 197, 94, 0.10)';
    else color = 'rgba(255, 255, 255, 0.07)';
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.fill();
    let stroke;
    if (t.type === 'radar') stroke = 'rgba(34, 197, 94, 0.30)';
    else stroke = 'rgba(58, 42, 26, 0.18)';
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 5]);
    ctx.beginPath();
    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);
  }
}

function drawCountdown() {
  if (state.inWave || state.gameOver) return;
  if (state.countdownTotal <= 0 || state.countdown <= 0) return;

  const frac = state.countdown / state.countdownTotal;
  const barW = 280;
  const barH = 22;
  const bx = W/2 - barW/2;
  const by = H - 70;

  // Label
  const nextWaveNum = state.wave + 1;
  ctx.fillStyle = '#3a2a1a';
  ctx.font = 'bold 18px Chewy';
  ctx.textAlign = 'center';
  ctx.fillText('Next wave in ' + Math.ceil(state.countdown) + 's', W/2, by - 8);

  // Bar shadow
  ctx.fillStyle = 'rgba(0, 0, 0, 0.25)';
  ctx.beginPath();
  ctx.roundRect(bx + 3, by + 4, barW, barH, barH/2);
  ctx.fill();
  // Bar background
  ctx.fillStyle = '#fff8eb';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(bx, by, barW, barH, barH/2);
  ctx.fill(); ctx.stroke();
  // Bar fill — fills up from empty to full (builds anticipation)
  const fillFrac = 1 - frac;
  ctx.fillStyle = '#ff6b47';
  ctx.save();
  ctx.beginPath();
  ctx.roundRect(bx, by, barW, barH, barH/2);
  ctx.clip();
  ctx.fillRect(bx, by, barW * fillFrac, barH);
  ctx.restore();
  // Shine on fill
  if (fillFrac > 0.02) {
    const sg = ctx.createLinearGradient(0, by, 0, by + barH);
    sg.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
    sg.addColorStop(0.5, 'rgba(255, 255, 255, 0.0)');
    ctx.fillStyle = sg;
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(bx, by, barW, barH, barH/2);
    ctx.clip();
    ctx.fillRect(bx, by, barW * fillFrac, barH);
    ctx.restore();
  }
  // Restroke for clean edge
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.roundRect(bx, by, barW, barH, barH/2);
  ctx.stroke();
}


function drawBeams() {
  for (const b of state.beams) {
    const alpha = Math.max(0, b.life / b.maxLife);
    // Outer glow
    ctx.strokeStyle = 'rgba(126, 200, 255, ' + (alpha * 0.45) + ')';
    ctx.lineWidth = b.width + 10;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.endX, b.endY);
    ctx.stroke();
    // Middle beam
    ctx.strokeStyle = 'rgba(43, 143, 214, ' + alpha + ')';
    ctx.lineWidth = b.width;
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.endX, b.endY);
    ctx.stroke();
    // Hot core
    ctx.strokeStyle = 'rgba(255, 255, 255, ' + alpha + ')';
    ctx.lineWidth = Math.max(2, b.width * 0.35);
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.endX, b.endY);
    ctx.stroke();
  }
  ctx.lineCap = 'butt';
}

function drawSniper(t) {
  // Base sandbag
  ctx.fillStyle = '#f0cd78';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.ellipse(0, 14, 22, 9, 0, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  const bob = Math.sin(t.bob) * 0.8;

  // Water tank body (vertical cylinder behind)
  ctx.save();
  ctx.translate(0, bob);
  const s = t.stats();
  const charge = (t.charge || 0) / s.chargeTime; // 0..1
  // Tank
  ctx.fillStyle = '#b8d8ea';
  ctx.strokeStyle = '#3a2a1a';
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.roundRect(-9, -22, 18, 20, 4);
  ctx.fill(); ctx.stroke();
  // Water level fill (rising with charge)
  const fillH = 18 * charge;
  if (fillH > 0.5) {
    ctx.fillStyle = charge >= 1 ? '#2b8fd6' : '#5cb3e8';
    ctx.save();
    ctx.beginPath();
    ctx.roundRect(-8, -21, 16, 18, 3);
    ctx.clip();
    ctx.fillRect(-8, -3 - fillH, 16, fillH);
    // wavy top
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = -8; x <= 8; x += 2) {
      const wy = -3 - fillH + Math.sin(x * 0.6 + state.time * 4) * 0.8;
      if (x === -8) ctx.moveTo(x, wy); else ctx.lineTo(x, wy);
    }
    ctx.stroke();
    ctx.restore();
  }
  // Full-charge glow
  if (charge >= 1) {
    const pulse = 0.5 + Math.sin(state.time * 10) * 0.3;
    ctx.strokeStyle = 'rgba(126, 200, 255, ' + pulse + ')';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.roundRect(-10, -23, 20, 22, 5);
    ctx.stroke();
  }
  ctx.restore();

  // Rotating barrel on top
  ctx.save();
  ctx.translate(0, bob);
  ctx.rotate(t.angle);

  const recoil = t.fireAnim > 0 ? (1 - t.fireAnim) * 6 : 0;

  // Tripod/mount
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath();
  ctx.arc(0, 0, 5, 0, Math.PI * 2);
  ctx.fill();

  // Long barrel
  ctx.fillStyle = '#2b8fd6';
  ctx.strokeStyle = '#0f4a7d';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.roundRect(2 - recoil, -4, 30, 8, 2);
  ctx.fill(); ctx.stroke();

  // Barrel stripes
  ctx.strokeStyle = '#0f4a7d';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(10 - recoil, -4); ctx.lineTo(10 - recoil, 4);
  ctx.moveTo(18 - recoil, -4); ctx.lineTo(18 - recoil, 4);
  ctx.stroke();

  // Scope / sight
  ctx.fillStyle = '#3a2a1a';
  ctx.beginPath();
  ctx.roundRect(6 - recoil, -9, 10, 5, 1.5);
  ctx.fill();
  ctx.fillStyle = '#ff6b47';
  ctx.beginPath();
  ctx.arc(15 - recoil, -6.5, 1.5, 0, Math.PI * 2);
  ctx.fill();

  // Charged crosshair laser from scope when fully charged
  if (charge >= 1 && t.target) {
    ctx.strokeStyle = 'rgba(255, 107, 71, ' + (0.4 + Math.sin(state.time * 20) * 0.3) + ')';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(32 - recoil, 0);
    ctx.lineTo(t.range, 0);
    ctx.stroke();
  }

  ctx.restore();
}

function drawParticles() {
  const dt = 1/60;
  for (let i = state.particles.length - 1; i >= 0; i--) {
    const p = state.particles[i];
    p.life -= dt;
    if (p.life <= 0) { state.particles.splice(i, 1); continue; }

    if (p.text) {
      p.y += p.vy * dt;
      p.vy *= 0.95;
      const alpha = Math.min(1, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 3;
      ctx.font = 'bold 18px Chewy';
      ctx.textAlign = 'center';
      ctx.globalAlpha = alpha;
      ctx.strokeText(p.str, p.x, p.y);
      ctx.fillText(p.str, p.x, p.y);
      ctx.globalAlpha = 1;
    } else if (p.tossedSand) {
      // Arcing toss from bucket to a random path spot, then spawns a SandWall on landing
      p.t += dt;
      const frac = Math.min(1, p.t / p.flightTime);
      const x = p.startX + (p.endX - p.startX) * frac;
      const y = p.startY + (p.endY - p.startY) * frac - Math.sin(frac * Math.PI) * 90;
      if (frac >= 1 && !p.landed) {
        p.landed = true;
        // Actually create the sand wall
        let ok = true;
        for (const w of state.sandWalls) {
          if (!w.dead && Math.abs(w.dist - p.pathDist) < 55) { ok = false; break; }
        }
        if (ok) {
          state.sandWalls.push(new SandWall(p.pathDist));
          spawnParticles(p.endX, p.endY, '#f0cd78', 18);
          floatText(p.endX, p.endY, 'FREE SAND!', '#22c55e');
        }
      }
      // Draw the tossed bundle
      ctx.fillStyle = '#f0cd78';
      ctx.strokeStyle = '#3a2a1a';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, 9, 0, Math.PI * 2);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#c99842';
      ctx.beginPath();
      ctx.arc(x - 3, y + 1, 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x + 3, y - 2, 1.8, 0, Math.PI * 2);
      ctx.fill();
    } else if (p.splash) {
      p.r += (p.maxR - p.r) * 0.2;
      const alpha = p.life / p.maxLife;
      ctx.strokeStyle = 'rgba(126, 200, 255, ' + alpha + ')';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 200 * dt;
      p.vx *= 0.92;
      const alpha = Math.min(1, p.life / p.maxLife);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = alpha;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }
}

// ============================================================
// GAME LOOP
// ============================================================
let lastTime = 0;
function loop(now) {
  const dt = Math.min(0.033, (now - lastTime) / 1000);
  lastTime = now;
  state.time += dt;

  if (!state.gameOver) {
    // Update
    updateWaveLogic(dt);
    for (const t of state.towers) t.update(dt);
    for (const e of state.enemies) e.update(dt);
    for (const pr of state.projectiles) pr.update(dt);
    for (const w of state.sandWalls) w.update(dt);
    // Decay sniper beams
    for (const b of state.beams) {
      b.life -= dt;
      if (b.life <= 0) b.dead = true;
    }
    if (state.bigWave) {
      state.bigWave.update(dt);
      if (state.bigWave.dead) state.bigWave = null;
    }
    // Cleanup (every frame)
    state.towers = state.towers.filter(t => {
      if (t._washed) {
        for (const s of BUILD_SPOTS) {
          if (s.occupied === t) s.occupied = null;
        }
        if (state.selectedTower === t) state.selectedTower = null;
        return false;
      }
      return true;
    });
    state.enemies = state.enemies.filter(e => !e.dead);
    state.projectiles = state.projectiles.filter(p => !p.dead);
    state.sandWalls = state.sandWalls.filter(w => !w.dead);
    state.beams = state.beams.filter(b => !b.dead);
  }

  // Render
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawPath();
  drawSandcastle();
  drawBuildSpots();

  for (const w of state.sandWalls) drawSandWall(w);
  drawAllRanges();
  for (const t of state.towers) drawTower(t);
  for (const e of state.enemies) drawEnemy(e);
  for (const p of state.projectiles) drawProjectile(p);
  drawBeams();

  drawBigWave();
  drawBigWaveWarning();

  drawHover();
  drawSelectedTower();
  drawParticles();
  drawCountdown();

  requestAnimationFrame(loop);
}

// ============================================================
// INITIAL RENDER
// ============================================================
updateHUD();
requestAnimationFrame(loop);
</script>
