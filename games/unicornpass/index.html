<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sparkle Dash — Unicorn Bubble Pop</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bungee&display=swap" rel="stylesheet">
<style>
  :root {
    --pink: #ff7ac6;
    --gold: #ffd34a;
    --dash-charge: #ffb84a;
    --dash-green: #44ff8a;
    --dash-cool: #6a6a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; touch-action: none; font-family: 'Fredoka', system-ui, sans-serif; background: #2a1a4a; color: white; }

  #game { position: absolute; inset: 0; display: block; }

  /* HUD */
  .hud {
    position: absolute; top: 14px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; align-items: center;
    background: rgba(42, 26, 74, 0.5);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 999px;
    padding: 8px 22px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.3);
    z-index: 10;
  }
  .hud .label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; opacity: 0.7; }
  .hud .value { font-family: 'Bungee', sans-serif; font-size: 20px; letter-spacing: 1px;
    background: linear-gradient(180deg, #fff, #ffd3f0); -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 12px rgba(255,180,230,0.6);
  }
  .hud .divider { width: 1px; height: 22px; background: rgba(255,255,255,0.25); }

  /* Joystick */
  .joy-zone { position: absolute; left: 0; bottom: 0; width: 50%; height: 70%; z-index: 5; }
  .joy-base {
    position: absolute; width: 140px; height: 140px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0.08) 60%, rgba(255,255,255,0) 80%);
    border: 2px solid rgba(255,255,255,0.5);
    box-shadow: 0 8px 28px rgba(0,0,0,0.18), inset 0 0 30px rgba(255,255,255,0.15);
    opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  .joy-stick {
    position: absolute; width: 64px; height: 64px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff 0%, #ffb7e8 60%, #ff7ac6 100%);
    border: 3px solid rgba(255,255,255,0.85);
    box-shadow: 0 6px 16px rgba(255,58,160,0.45), inset 0 -4px 8px rgba(0,0,0,0.12);
    opacity: 0; transition: opacity 0.15s; pointer-events: none;
  }
  .joy-base.active, .joy-stick.active { opacity: 1; }

  /* Dash button */
  .btn-zone { position: absolute; right: 24px; bottom: 32px; display: flex; gap: 16px; align-items: flex-end; z-index: 6; }
  .gbtn {
    position: relative;
    width: 106px; height: 106px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.8);
    font-family: 'Bungee', sans-serif; font-size: 16px; letter-spacing: 1.5px;
    color: white; cursor: pointer;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 10px 24px rgba(0,0,0,0.25),
                inset 0 -4px 8px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.4);
    transition: transform 0.08s, box-shadow 0.08s;
    display: flex; align-items: center; justify-content: center;
    text-shadow: 0 2px 0 rgba(0,0,0,0.2);
    background: radial-gradient(circle at 35% 30%, #fff 0%, #d8d8ff 60%, #9890c8 100%);
  }
  .gbtn:active { transform: translateY(4px); box-shadow: 0 4px 0 rgba(0,0,0,0.15), 0 6px 12px rgba(0,0,0,0.25), inset 0 -2px 4px rgba(0,0,0,0.15); }
  #dashBtn.window {
    background: radial-gradient(circle at 35% 30%, #d0ffd8 0%, var(--dash-green) 50%, #20c860 100%);
    animation: pulseGreen 0.25s ease-in-out infinite alternate;
    box-shadow: 0 8px 0 rgba(0,0,0,0.15), 0 10px 30px rgba(68,255,138,0.7), inset 0 -4px 8px rgba(0,0,0,0.15), inset 0 2px 4px rgba(255,255,255,0.4);
  }
  #dashBtn.cooldown {
    background: radial-gradient(circle at 35% 30%, #555 0%, var(--dash-cool) 60%, #3a3a4a 100%);
    opacity: 0.6;
  }
  @keyframes pulseGreen { from { transform: scale(1); } to { transform: scale(1.06); } }
  .charge-ring { position: absolute; inset: -8px; border-radius: 50%; pointer-events: none; opacity: 0; }
  .charge-ring.show { opacity: 1; }

  /* Toast */
  .toast {
    position: absolute; top: 80px; left: 50%; transform: translate(-50%, 0);
    font-family: 'Bungee', sans-serif; font-size: 26px;
    background: linear-gradient(180deg, #fff, #ffd3f0);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 24px rgba(255,180,230,0.8);
    opacity: 0; pointer-events: none; z-index: 9;
    transition: opacity 0.2s, transform 0.4s;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 12px); }

  /* Splash */
  .splash {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, rgba(42,26,74,0.4) 0%, rgba(42,26,74,0.85) 100%);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
    transition: opacity 0.4s; gap: 24px;
  }
  .splash.hidden { opacity: 0; pointer-events: none; }
  .splash h1 {
    font-family: 'Bungee', sans-serif; font-size: clamp(40px, 9vw, 80px); line-height: 0.95;
    background: linear-gradient(180deg, #fff 0%, #ffd3f0 50%, #ff7ac6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 8px 40px rgba(255,122,198,0.5);
    letter-spacing: 2px; text-align: center;
  }
  .splash h1 .small { display: block; font-size: 0.4em; letter-spacing: 8px; opacity: 0.8; margin-bottom: 8px; }
  .splash .instructions {
    background: rgba(42,26,74,0.55); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border: 2px solid rgba(255,255,255,0.3); border-radius: 24px;
    padding: 20px 28px; max-width: 460px; font-size: 15px; line-height: 1.6;
  }
  .splash .instructions strong { color: var(--gold); font-weight: 700; }
  .splash .instructions .dash-word { color: var(--dash-green); font-weight: 700; }
  .splash .play-btn {
    background: linear-gradient(180deg, #ffd3f0, #ff7ac6);
    color: #2a1a4a; border: 3px solid rgba(255,255,255,0.9);
    padding: 16px 48px; border-radius: 999px;
    font-family: 'Bungee', sans-serif; font-size: 22px; letter-spacing: 2px;
    cursor: pointer;
    box-shadow: 0 10px 0 #b94888, 0 14px 30px rgba(0,0,0,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .splash .play-btn:active { transform: translateY(6px); box-shadow: 0 4px 0 #b94888, 0 8px 18px rgba(0,0,0,0.3); }

  @media (max-width: 480px) {
    .gbtn { width: 92px; height: 92px; font-size: 14px; }
    .btn-zone { right: 16px; bottom: 24px; gap: 12px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div class="hud">
  <div><div class="label">Score</div><div class="value" id="score">0</div></div>
  <div class="divider"></div>
  <div><div class="label">Combo</div><div class="value" id="combo">x1</div></div>
</div>

<div class="joy-zone" id="joyZone">
  <div class="joy-base" id="joyBase"></div>
  <div class="joy-stick" id="joyStick"></div>
</div>

<div class="btn-zone">
  <button class="gbtn" id="dashBtn">
    DASH
    <svg class="charge-ring" id="chargeRing" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="46" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="4"
        stroke-dasharray="289" stroke-dashoffset="289" stroke-linecap="round"
        transform="rotate(-90 50 50)" id="ringCircle"/>
    </svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<div class="splash" id="splash">
  <h1><span class="small">SPARKLE</span>DASH</h1>
  <div class="instructions">
    🦄 Move with the <strong>left joystick</strong>.<br>
    🫧 Just <strong>run into bubbles</strong> with your horn to pop them.<br>
    👑 <strong>Boss bubbles</strong> (the big golden ones) need a <span class="dash-word">DASH</span>:
    tap DASH, then tap again during the green flash to charge through them!
  </div>
  <button class="play-btn" id="playBtn">PLAY</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ============================================================
//  SPARKLE DASH — 3D Edition
// ============================================================
const canvas = document.getElementById('game');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xffb7e8);
scene.fog = new THREE.Fog(0xffd3f0, 35, 95);

const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 300);
camera.position.set(0, 4, 8);

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============================================================
//  SKY (large inverted sphere with gradient shader)
// ============================================================
const skyMat = new THREE.ShaderMaterial({
  uniforms: {
    topColor: { value: new THREE.Color(0x88c8ff) },
    midColor: { value: new THREE.Color(0xc8b8ff) },
    bottomColor: { value: new THREE.Color(0xffd3f0) },
  },
  vertexShader: `
    varying vec3 vDir;
    void main() {
      vDir = normalize(position);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: `
    uniform vec3 topColor;
    uniform vec3 midColor;
    uniform vec3 bottomColor;
    varying vec3 vDir;
    void main() {
      float h = vDir.y * 0.5 + 0.5;
      vec3 c = mix(bottomColor, midColor, smoothstep(0.0, 0.5, h));
      c = mix(c, topColor, smoothstep(0.5, 1.0, h));
      gl_FragColor = vec4(c, 1.0);
    }`,
  side: THREE.BackSide,
  depthWrite: false,
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(150, 24, 16), skyMat));

// ============================================================
//  LIGHTS
// ============================================================
scene.add(new THREE.HemisphereLight(0xffe8f4, 0xa888c8, 0.7));
const sun = new THREE.DirectionalLight(0xfff4d8, 0.95);
sun.position.set(12, 22, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.camera.left = -25; sun.shadow.camera.right = 25;
sun.shadow.camera.top = 25; sun.shadow.camera.bottom = -25;
sun.shadow.camera.near = 0.5; sun.shadow.camera.far = 80;
sun.shadow.bias = -0.0008;
scene.add(sun);

// ============================================================
//  GROUND with hills around play area
// ============================================================
const groundGeo = new THREE.PlaneGeometry(220, 220, 60, 60);
const gpos = groundGeo.attributes.position;
for (let i = 0; i < gpos.count; i++) {
  const x = gpos.getX(i), y = gpos.getY(i);
  const r = Math.hypot(x, y);
  let z = 0;
  if (r > 18) {
    const t = Math.min((r - 18) / 14, 1);
    z = (Math.sin(x * 0.18) * 1.6 + Math.cos(y * 0.22) * 1.8 + Math.sin(r * 0.12) * 1.6) * t;
  }
  gpos.setZ(i, z);
}
groundGeo.computeVertexNormals();
const ground = new THREE.Mesh(groundGeo, new THREE.MeshLambertMaterial({ color: 0x8fd87a }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Lighter green dots near origin (sense of "the meadow")
for (let i = 0; i < 30; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = Math.random() * 16;
  const p = new THREE.Mesh(
    new THREE.CircleGeometry(0.6 + Math.random() * 0.4, 12),
    new THREE.MeshBasicMaterial({ color: 0xbaf0a4, transparent: true, opacity: 0.55 })
  );
  p.rotation.x = -Math.PI / 2;
  p.position.set(Math.cos(a) * r, 0.012, Math.sin(a) * r);
  scene.add(p);
}

// ============================================================
//  SCENERY — mushrooms, crystals, floating rocks
// ============================================================
const floatingRocks = [];
const mushroomColors = [0xff6688, 0xffa050, 0x88aaff, 0xffd34a, 0xc880ff, 0xff7ac6];

function makeMushroom(color) {
  const g = new THREE.Group();
  const stem = new THREE.Mesh(
    new THREE.CylinderGeometry(0.28, 0.38, 1.6, 8),
    new THREE.MeshLambertMaterial({ color: 0xf0e8d0 })
  );
  stem.position.y = 0.8;
  stem.castShadow = true; stem.receiveShadow = true;
  g.add(stem);
  const cap = new THREE.Mesh(
    new THREE.SphereGeometry(1.1, 14, 8, 0, Math.PI * 2, 0, Math.PI / 2),
    new THREE.MeshLambertMaterial({ color })
  );
  cap.position.y = 1.6;
  cap.castShadow = true;
  g.add(cap);
  for (let i = 0; i < 4; i++) {
    const a = (i / 4) * Math.PI * 2 + Math.random() * 0.6;
    const dot = new THREE.Mesh(
      new THREE.SphereGeometry(0.13, 6, 5),
      new THREE.MeshLambertMaterial({ color: 0xffffff })
    );
    dot.position.set(Math.cos(a) * 0.7, 2.0, Math.sin(a) * 0.7);
    g.add(dot);
  }
  return g;
}
for (let i = 0; i < 28; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 11 + Math.random() * 28;
  const m = makeMushroom(mushroomColors[Math.floor(Math.random() * mushroomColors.length)]);
  m.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  m.scale.setScalar(0.55 + Math.random() * 0.9);
  m.rotation.y = Math.random() * Math.PI * 2;
  scene.add(m);
}

function makeCrystalCluster() {
  const g = new THREE.Group();
  const mat = new THREE.MeshPhongMaterial({
    color: 0xb088ff, emissive: 0x4a2080, emissiveIntensity: 0.35,
    shininess: 100, transparent: true, opacity: 0.88,
  });
  for (let i = 0; i < 5; i++) {
    const h = 0.8 + Math.random() * 1.5;
    const c = new THREE.Mesh(new THREE.ConeGeometry(0.18 + Math.random() * 0.18, h, 6), mat);
    c.position.set((Math.random() - 0.5) * 0.7, h / 2, (Math.random() - 0.5) * 0.7);
    c.rotation.set((Math.random() - 0.5) * 0.4, Math.random() * Math.PI, (Math.random() - 0.5) * 0.4);
    c.castShadow = true;
    g.add(c);
  }
  return g;
}
for (let i = 0; i < 7; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 14 + Math.random() * 22;
  const c = makeCrystalCluster();
  c.position.set(Math.cos(a) * r, 0, Math.sin(a) * r);
  c.scale.setScalar(0.8 + Math.random() * 0.6);
  scene.add(c);
}

// Floating rocks
for (let i = 0; i < 5; i++) {
  const a = Math.random() * Math.PI * 2;
  const r = 18 + Math.random() * 14;
  const rock = new THREE.Mesh(
    new THREE.IcosahedronGeometry(0.6 + Math.random() * 0.5, 0),
    new THREE.MeshLambertMaterial({ color: 0xc8a0c8 })
  );
  rock.position.set(Math.cos(a) * r, 5 + Math.random() * 3, Math.sin(a) * r);
  rock.rotation.set(Math.random(), Math.random(), Math.random());
  rock.castShadow = true;
  rock.userData.baseY = rock.position.y;
  rock.userData.bobPhase = Math.random() * Math.PI * 2;
  scene.add(rock);
  floatingRocks.push(rock);
}

// ============================================================
//  UNICORN
// ============================================================
function makeUnicorn() {
  const g = new THREE.Group();
  const bobGroup = new THREE.Group();
  g.add(bobGroup);
  g.userData.bobGroup = bobGroup;

  const whiteMat = new THREE.MeshLambertMaterial({ color: 0xffffff });

  // Body
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.58, 18, 14), whiteMat);
  body.scale.set(0.92, 0.78, 1.32);
  body.position.set(0, 0.78, 0);
  body.castShadow = true;
  bobGroup.add(body);

  // Neck
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 0.55, 10), whiteMat);
  neck.position.set(0, 1.04, -0.45);
  neck.rotation.x = Math.PI / 2.5;
  neck.castShadow = true;
  bobGroup.add(neck);

  // Head
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), whiteMat);
  head.scale.set(0.9, 0.92, 1.15);
  head.position.set(0, 1.22, -0.78);
  head.castShadow = true;
  bobGroup.add(head);

  // Snout
  const snout = new THREE.Mesh(new THREE.SphereGeometry(0.2, 12, 10), whiteMat);
  snout.scale.set(0.85, 0.72, 1);
  snout.position.set(0, 1.07, -1.1);
  snout.castShadow = true;
  bobGroup.add(snout);

  // Nose
  const nose = new THREE.Mesh(
    new THREE.SphereGeometry(0.05, 8, 6),
    new THREE.MeshLambertMaterial({ color: 0xffb0c8 })
  );
  nose.position.set(0, 1.05, -1.28);
  bobGroup.add(nose);

  // Ears
  for (const dx of [-0.18, 0.18]) {
    const ear = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.24, 6), whiteMat);
    ear.position.set(dx, 1.46, -0.72);
    ear.rotation.x = -0.15;
    ear.castShadow = true;
    bobGroup.add(ear);
    const inner = new THREE.Mesh(
      new THREE.ConeGeometry(0.05, 0.18, 6),
      new THREE.MeshLambertMaterial({ color: 0xffc0d8 })
    );
    inner.position.set(dx, 1.44, -0.7);
    inner.rotation.x = -0.15;
    bobGroup.add(inner);
  }

  // Horn
  const hornMat = new THREE.MeshPhongMaterial({
    color: 0xffd34a, emissive: 0x886600, emissiveIntensity: 0.35, shininess: 100,
  });
  const horn = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.6, 10), hornMat);
  horn.position.set(0, 1.66, -0.92);
  horn.rotation.x = -0.25;
  horn.castShadow = true;
  bobGroup.add(horn);
  g.userData.horn = horn;
  const hornTip = new THREE.Object3D();
  hornTip.position.set(0, 0.32, 0);
  horn.add(hornTip);
  g.userData.hornTip = hornTip;

  // Horn rings
  for (let i = 1; i <= 3; i++) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.085 - i * 0.018, 0.012, 6, 12),
      new THREE.MeshPhongMaterial({ color: 0xb88820, shininess: 80 })
    );
    ring.rotation.x = Math.PI / 2;
    ring.position.y = -0.15 + i * 0.13;
    horn.add(ring);
  }

  // Eyes
  for (const dx of [-0.13, 0.13]) {
    const eye = new THREE.Mesh(
      new THREE.SphereGeometry(0.055, 10, 8),
      new THREE.MeshBasicMaterial({ color: 0x2a1a4a })
    );
    eye.position.set(dx, 1.25, -1.0);
    bobGroup.add(eye);
    const sparkle = new THREE.Mesh(
      new THREE.SphereGeometry(0.018, 6, 4),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    sparkle.position.set(dx + 0.02, 1.27, -1.04);
    bobGroup.add(sparkle);
  }

  // Mane — rainbow stripes along top
  const maneColors = [0xff6fb8, 0xffa844, 0xffe04a, 0x6fe0a0, 0x5aaaff, 0xa080ff];
  for (let i = 0; i < maneColors.length; i++) {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.14, 12, 10),
      new THREE.MeshLambertMaterial({ color: maneColors[i] })
    );
    m.scale.set(0.85, 0.75, 1.05);
    m.position.set(0, 1.42 - i * 0.06, -0.62 + i * 0.18);
    m.castShadow = true;
    bobGroup.add(m);
  }

  // Tail
  const tailGroup = new THREE.Group();
  tailGroup.position.set(0, 0.95, 0.65);
  for (let i = 0; i < maneColors.length; i++) {
    const t = new THREE.Mesh(
      new THREE.SphereGeometry(0.13, 12, 10),
      new THREE.MeshLambertMaterial({ color: maneColors[i] })
    );
    t.scale.set(0.95, 0.8, 1.05);
    t.position.set(0, -i * 0.06, i * 0.15);
    t.castShadow = true;
    tailGroup.add(t);
  }
  bobGroup.add(tailGroup);
  g.userData.tail = tailGroup;

  // Legs
  const hoofMat = new THREE.MeshLambertMaterial({ color: 0xd8a070 });
  const legSpots = [[-0.28, -0.42], [0.28, -0.42], [-0.28, 0.42], [0.28, 0.42]];
  const legs = [];
  for (const [lx, lz] of legSpots) {
    const lg = new THREE.Group();
    lg.position.set(lx, 0, lz);
    const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 0.62, 8), whiteMat);
    leg.position.y = 0.31; leg.castShadow = true;
    lg.add(leg);
    const hoof = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.11, 0.1, 8), hoofMat);
    hoof.position.y = 0.05; hoof.castShadow = true;
    lg.add(hoof);
    g.add(lg);
    legs.push(lg);
  }
  g.userData.legs = legs;

  // Fake ground shadow disc
  const shadowDisc = new THREE.Mesh(
    new THREE.CircleGeometry(0.85, 24),
    new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.25 })
  );
  shadowDisc.rotation.x = -Math.PI / 2;
  shadowDisc.position.y = 0.015;
  g.add(shadowDisc);

  return g;
}

const unicorn = makeUnicorn();
scene.add(unicorn);

// ============================================================
//  BUBBLES
// ============================================================
const bubbles = [];
function makeBubble(forceBoss = null) {
  const boss = forceBoss !== null ? forceBoss : (Math.random() < 0.2);
  const r = boss ? 1.0 + Math.random() * 0.3 : 0.42 + Math.random() * 0.18;
  let mat;
  if (boss) {
    mat = new THREE.MeshPhongMaterial({
      color: 0xffd34a, emissive: 0xff8800, emissiveIntensity: 0.45,
      shininess: 120, transparent: true, opacity: 0.78,
    });
  } else {
    const col = new THREE.Color().setHSL(Math.random(), 0.85, 0.72);
    mat = new THREE.MeshPhongMaterial({
      color: col, emissive: col.clone().multiplyScalar(0.45),
      emissiveIntensity: 0.5, shininess: 90, transparent: true, opacity: 0.66,
    });
  }
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, 18, 14), mat);
  const a = Math.random() * Math.PI * 2;
  const dist = 6 + Math.random() * 18;
  const baseY = boss ? 1.5 + Math.random() * 0.4 : 1.1 + Math.random() * 1.4;
  mesh.position.set(
    unicorn.position.x + Math.cos(a) * dist, baseY,
    unicorn.position.z + Math.sin(a) * dist
  );
  // highlight
  const hl = new THREE.Mesh(
    new THREE.SphereGeometry(r * 0.22, 10, 8),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.85 })
  );
  hl.position.set(-r * 0.4, r * 0.4, -r * 0.4);
  mesh.add(hl);
  mesh.userData = {
    radius: r, boss, baseY,
    bobPhase: Math.random() * Math.PI * 2,
    bobSpeed: 1.1 + Math.random() * 0.8,
    drift: new THREE.Vector3((Math.random() - 0.5) * 0.4, 0, (Math.random() - 0.5) * 0.4),
    spin: Math.random() * Math.PI * 2,
  };
  return mesh;
}
function spawnBubble(forceBoss = null) {
  const b = makeBubble(forceBoss);
  bubbles.push(b);
  scene.add(b);
}
for (let i = 0; i < 12; i++) spawnBubble(i < 2 ? true : i < 9 ? false : null);

// ============================================================
//  PARTICLES
// ============================================================
const particles = [];
const particleGeo = new THREE.SphereGeometry(1, 6, 5);
function spawnPopBurst(pos, color, boss) {
  const count = boss ? 30 : 16;
  for (let i = 0; i < count; i++) {
    const c = boss
      ? new THREE.Color().setHSL(0.1 + Math.random() * 0.1, 0.9, 0.65)
      : (color instanceof THREE.Color ? color.clone() : new THREE.Color().setHSL(Math.random(), 0.9, 0.7));
    const p = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 1 }));
    const size = (boss ? 0.18 : 0.12) * (0.7 + Math.random() * 0.6);
    p.scale.setScalar(size);
    p.position.copy(pos);
    const phi = Math.random() * Math.PI * 2;
    const theta = Math.random() * Math.PI;
    const speed = boss ? 4 + Math.random() * 4 : 2.5 + Math.random() * 2.5;
    p.userData = {
      vel: new THREE.Vector3(
        Math.sin(theta) * Math.cos(phi) * speed,
        Math.cos(theta) * speed * 0.7 + 2,
        Math.sin(theta) * Math.sin(phi) * speed
      ),
      life: 0.7 + Math.random() * 0.5, age: 0, initSize: size,
    };
    particles.push(p);
    scene.add(p);
  }
}
function spawnDashTrail() {
  const fwd = new THREE.Vector3(0, 0, -1).applyQuaternion(unicorn.quaternion);
  const back = unicorn.position.clone().addScaledVector(fwd, -0.5);
  back.y += 0.8 + Math.random() * 0.4;
  back.x += (Math.random() - 0.5) * 0.4;
  back.z += (Math.random() - 0.5) * 0.4;
  const c = new THREE.Color().setHSL(Math.random(), 0.9, 0.75);
  const p = new THREE.Mesh(particleGeo, new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 1 }));
  p.scale.setScalar(0.15);
  p.position.copy(back);
  p.userData = {
    vel: new THREE.Vector3((Math.random() - 0.5) * 1, 0.5 + Math.random(), (Math.random() - 0.5) * 1),
    life: 0.6, age: 0, initSize: 0.15,
  };
  particles.push(p);
  scene.add(p);
}

// ============================================================
//  POP TEXT (screen-space, projected from world pos)
// ============================================================
const popTexts = [];
function spawnPopText(worldPos, text, boss) {
  const div = document.createElement('div');
  div.textContent = text;
  div.style.cssText = `
    position: absolute; pointer-events: none; z-index: 8;
    font-family: 'Bungee', sans-serif; font-size: ${boss ? '32px' : '22px'};
    color: ${boss ? '#ffd34a' : '#ffffff'};
    text-shadow: 0 2px 0 #2a1a4a, 0 0 12px rgba(255,180,230,0.8);
    transform: translate(-50%, -50%); transition: opacity 0.6s ease-out;`;
  document.body.appendChild(div);
  popTexts.push({ div, worldPos: worldPos.clone(), age: 0, life: 1.0 });
}

// ============================================================
//  GAME STATE
// ============================================================
const game = { running: false, t: 0, score: 0, combo: 1, comboTimer: 0, shake: 0, spawnTimer: 3 };
const uState = {
  vel: new THREE.Vector3(),
  speed: 0,
  yaw: 0, targetYaw: 0,
  dashing: 0,
  dashState: 'ready',
  dashStateTimer: 0,
};

// ============================================================
//  INPUT
// ============================================================
const joy = { active: false, id: null, ox: 0, oy: 0, dx: 0, dy: 0, mag: 0 };
const joyZone = document.getElementById('joyZone');
const joyBase = document.getElementById('joyBase');
const joyStick = document.getElementById('joyStick');

function joyStart(x, y) {
  joy.active = true; joy.ox = x; joy.oy = y; joy.dx = 0; joy.dy = 0; joy.mag = 0;
  joyBase.classList.add('active'); joyStick.classList.add('active');
  positionJoy(x, y, x, y);
}
function joyMove(x, y) {
  if (!joy.active) return;
  let dx = x - joy.ox, dy = y - joy.oy;
  const mag = Math.hypot(dx, dy), max = 60;
  if (mag > max) { dx = dx / mag * max; dy = dy / mag * max; }
  joy.dx = dx / max; joy.dy = dy / max; joy.mag = Math.min(mag / max, 1);
  positionJoy(joy.ox, joy.oy, joy.ox + dx, joy.oy + dy);
}
function joyEnd() {
  joy.active = false; joy.id = null;
  joy.dx = 0; joy.dy = 0; joy.mag = 0;
  joyBase.classList.remove('active'); joyStick.classList.remove('active');
}
function positionJoy(bx, by, sx, sy) {
  joyBase.style.left = (bx - 70) + 'px'; joyBase.style.top = (by - 70) + 'px';
  joyStick.style.left = (sx - 32) + 'px'; joyStick.style.top = (sy - 32) + 'px';
}

joyZone.addEventListener('touchstart', (e) => {
  e.preventDefault();
  if (joy.active) return;
  const t = e.changedTouches[0];
  joy.id = t.identifier;
  joyStart(t.clientX, t.clientY);
}, { passive: false });
joyZone.addEventListener('touchmove', (e) => {
  e.preventDefault();
  for (const t of e.changedTouches) if (t.identifier === joy.id) { joyMove(t.clientX, t.clientY); break; }
}, { passive: false });
joyZone.addEventListener('touchend', (e) => {
  for (const t of e.changedTouches) if (t.identifier === joy.id) { joyEnd(); break; }
}, { passive: false });
joyZone.addEventListener('touchcancel', joyEnd);
joyZone.addEventListener('mousedown', (e) => { joyStart(e.clientX, e.clientY); });
window.addEventListener('mousemove', (e) => { if (joy.active && joy.id === null) joyMove(e.clientX, e.clientY); });
window.addEventListener('mouseup', () => { if (joy.active && joy.id === null) joyEnd(); });

// Keyboard
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key.toLowerCase()] = true;
  if (e.key.toLowerCase() === 'e' || e.key === 'Shift' || e.key === ' ') { e.preventDefault(); doDash(); }
});
window.addEventListener('keyup', (e) => { keys[e.key.toLowerCase()] = false; });

function readKeyboardJoystick() {
  if (joy.active) return;
  let dx = 0, dy = 0;
  if (keys['arrowleft'] || keys['a']) dx -= 1;
  if (keys['arrowright'] || keys['d']) dx += 1;
  if (keys['arrowup'] || keys['w']) dy -= 1;
  if (keys['arrowdown'] || keys['s']) dy += 1;
  const m = Math.hypot(dx, dy);
  if (m > 0) { joy.dx = dx / m; joy.dy = dy / m; joy.mag = 1; }
  else { joy.dx = 0; joy.dy = 0; joy.mag = 0; }
}

// ============================================================
//  DASH BUTTON
// ============================================================
const dashBtn = document.getElementById('dashBtn');
const ringCircle = document.getElementById('ringCircle');
const chargeRing = document.getElementById('chargeRing');

function doDash() {
  if (!game.running) return;
  if (uState.dashState === 'ready') {
    uState.dashState = 'window';
    uState.dashStateTimer = 0.5;
    dashBtn.classList.remove('cooldown');
    dashBtn.classList.add('window');
  } else if (uState.dashState === 'window') {
    uState.dashState = 'dashing';
    uState.dashing = 0.35;
    uState.dashStateTimer = 0.35;
    dashBtn.classList.remove('window');
    game.shake = Math.max(game.shake, 0.25);
    for (let i = 0; i < 14; i++) spawnDashTrail();
  }
}
function bindButton(btn, handler) {
  let pressed = false;
  btn.addEventListener('touchstart', (e) => { e.preventDefault(); if (!pressed) { pressed = true; handler(); } }, { passive: false });
  btn.addEventListener('touchend', (e) => { e.preventDefault(); pressed = false; }, { passive: false });
  btn.addEventListener('mousedown', (e) => { e.preventDefault(); handler(); });
}
bindButton(dashBtn, doDash);

// ============================================================
//  TOAST
// ============================================================
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function showToast(text, color = '#ffd34a') {
  toastEl.textContent = text;
  toastEl.style.background = `linear-gradient(180deg, #fff, ${color})`;
  toastEl.style.webkitBackgroundClip = 'text';
  toastEl.style.backgroundClip = 'text';
  toastEl.classList.add('show');
  toastTimer = 1.2;
}

// ============================================================
//  POP
// ============================================================
function popBubble(b, fromDash) {
  if (b.userData.dead) return;
  if (b.userData.boss && !fromDash) return;
  b.userData.dead = true;
  const points = b.userData.boss ? 100 : 10;
  const gained = points * game.combo;
  game.score += gained;
  game.combo = Math.min(game.combo + 1, 9);
  game.comboTimer = 2.5;
  spawnPopBurst(b.position, b.material.color, b.userData.boss);
  spawnPopText(b.position.clone().add(new THREE.Vector3(0, 0.4, 0)), '+' + gained, b.userData.boss);
  if (b.userData.boss) {
    game.shake = Math.max(game.shake, 0.35);
    showToast("BOSS POP!", '#ffd34a');
  }
  scene.remove(b);
}

// ============================================================
//  MAIN LOOP
// ============================================================
const tmpV1 = new THREE.Vector3();
const tmpV2 = new THREE.Vector3();
const tmpV3 = new THREE.Vector3();
const upVec = new THREE.Vector3(0, 1, 0);
const hornTipPos = new THREE.Vector3();

let lastT = performance.now();
function loop(now) {
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;
  if (game.running) update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}

function update(dt) {
  game.t += dt;
  readKeyboardJoystick();

  // Camera-relative move direction
  camera.getWorldDirection(tmpV1);
  tmpV1.y = 0; tmpV1.normalize();
  tmpV2.crossVectors(tmpV1, upVec).normalize();
  const moveDir = tmpV3.set(0, 0, 0)
    .addScaledVector(tmpV2, joy.dx)
    .addScaledVector(tmpV1, -joy.dy);
  const moveMag = Math.min(moveDir.length(), 1);
  if (moveMag > 0) moveDir.normalize();

  // Movement
  if (uState.dashing > 0) {
    uState.dashing -= dt;
    const dashF = new THREE.Vector3(0, 0, -1).applyQuaternion(unicorn.quaternion);
    unicorn.position.addScaledVector(dashF, 16 * dt);
    spawnDashTrail();
    if (uState.dashing <= 0) {
      uState.dashState = 'cooldown';
      uState.dashStateTimer = 0.7;
      dashBtn.classList.add('cooldown');
    }
  } else {
    const accel = 38, friction = 6.5, maxSpeed = 7;
    uState.vel.x += moveDir.x * moveMag * accel * dt;
    uState.vel.z += moveDir.z * moveMag * accel * dt;
    uState.vel.x -= uState.vel.x * friction * dt;
    uState.vel.z -= uState.vel.z * friction * dt;
    const sp = Math.hypot(uState.vel.x, uState.vel.z);
    if (sp > maxSpeed) { uState.vel.x = uState.vel.x / sp * maxSpeed; uState.vel.z = uState.vel.z / sp * maxSpeed; }
    unicorn.position.x += uState.vel.x * dt;
    unicorn.position.z += uState.vel.z * dt;
    uState.speed = sp;
  }

  // Soft bounds
  const boundR = 35;
  const dOrig = Math.hypot(unicorn.position.x, unicorn.position.z);
  if (dOrig > boundR) {
    const k = boundR / dOrig;
    unicorn.position.x *= k; unicorn.position.z *= k;
    uState.vel.multiplyScalar(0.5);
  }

  // Face direction of movement
  if (moveMag > 0.05 && uState.dashing <= 0) {
    uState.targetYaw = Math.atan2(moveDir.x, moveDir.z) + Math.PI;
  }
  let diff = uState.targetYaw - uState.yaw;
  while (diff > Math.PI) diff -= Math.PI * 2;
  while (diff < -Math.PI) diff += Math.PI * 2;
  uState.yaw += diff * Math.min(1, dt * 9);
  unicorn.rotation.y = uState.yaw;

  // Leg animation
  const trotSpeed = Math.min((uState.speed + (uState.dashing > 0 ? 16 : 0)) * 1.6, 22);
  const isMoving = uState.speed > 0.5 || uState.dashing > 0;
  const trot = game.t * trotSpeed;
  if (isMoving) {
    unicorn.userData.legs[0].position.y = Math.max(0, Math.sin(trot) * 0.12);
    unicorn.userData.legs[1].position.y = Math.max(0, Math.sin(trot + Math.PI) * 0.12);
    unicorn.userData.legs[2].position.y = Math.max(0, Math.sin(trot + Math.PI) * 0.12);
    unicorn.userData.legs[3].position.y = Math.max(0, Math.sin(trot) * 0.12);
    unicorn.userData.bobGroup.position.y = Math.abs(Math.sin(trot)) * 0.06;
  } else {
    for (const l of unicorn.userData.legs) l.position.y *= 0.85;
    unicorn.userData.bobGroup.position.y *= 0.85;
  }
  unicorn.userData.tail.rotation.y = Math.sin(game.t * 3) * 0.18;

  // Dash state timers
  if (uState.dashState === 'window') {
    uState.dashStateTimer -= dt;
    if (uState.dashStateTimer <= 0) {
      uState.dashState = 'cooldown';
      uState.dashStateTimer = 0.7;
      dashBtn.classList.remove('window');
      dashBtn.classList.add('cooldown');
    }
  } else if (uState.dashState === 'cooldown') {
    uState.dashStateTimer -= dt;
    if (uState.dashStateTimer <= 0) {
      uState.dashState = 'ready';
      dashBtn.classList.remove('cooldown');
    }
  }

  // Camera follow
  const camDist = 6.5, camHeight = 3.2;
  const unicornForward = new THREE.Vector3(0, 0, -1).applyQuaternion(unicorn.quaternion);
  const desired = unicorn.position.clone()
    .addScaledVector(unicornForward, -camDist)
    .add(new THREE.Vector3(0, camHeight, 0));
  const followLerp = uState.dashing > 0 ? 12 : 4.5;
  camera.position.lerp(desired, Math.min(1, dt * followLerp));

  // Shake
  if (game.shake > 0) {
    camera.position.x += (Math.random() - 0.5) * game.shake;
    camera.position.y += (Math.random() - 0.5) * game.shake;
    game.shake *= (1 - dt * 6);
    if (game.shake < 0.02) game.shake = 0;
  }
  const lookTarget = unicorn.position.clone().add(new THREE.Vector3(0, 1.1, 0));
  lookTarget.addScaledVector(unicornForward, 1.5);
  camera.lookAt(lookTarget);

  // Bubble update + horn collision
  unicorn.userData.hornTip.getWorldPosition(hornTipPos);
  for (let i = bubbles.length - 1; i >= 0; i--) {
    const b = bubbles[i];
    if (b.userData.dead) { bubbles.splice(i, 1); continue; }
    b.userData.bobPhase += b.userData.bobSpeed * dt;
    b.position.y = b.userData.baseY + Math.sin(b.userData.bobPhase) * 0.18;
    b.position.x += b.userData.drift.x * dt;
    b.position.z += b.userData.drift.z * dt;
    b.userData.drift.multiplyScalar(1 - dt * 0.3);
    if (b.userData.drift.lengthSq() < 0.001) {
      b.userData.drift.set((Math.random() - 0.5) * 0.5, 0, (Math.random() - 0.5) * 0.5);
    }
    b.userData.spin += dt * 0.3;
    b.rotation.y = b.userData.spin;

    const d = hornTipPos.distanceTo(b.position);
    const reach = b.userData.radius + 0.18;
    if (d < reach) {
      if (b.userData.boss) {
        if (uState.dashing > 0) popBubble(b, true);
      } else {
        popBubble(b, false);
      }
    }
    // Forgiving body bonk for boss bubbles during dash
    if (uState.dashing > 0 && b.userData.boss && !b.userData.dead) {
      const bodyDist = unicorn.position.distanceTo(new THREE.Vector3(b.position.x, unicorn.position.y + 0.8, b.position.z));
      if (bodyDist < b.userData.radius + 0.6) popBubble(b, true);
    }
  }

  // Spawn more bubbles
  game.spawnTimer -= dt;
  const live = bubbles.filter(b => !b.userData.dead).length;
  if (game.spawnTimer <= 0 && live < 14) {
    spawnBubble();
    game.spawnTimer = 0.8 + Math.random() * 0.8;
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.userData.age += dt;
    if (p.userData.age >= p.userData.life) {
      scene.remove(p); p.material.dispose(); particles.splice(i, 1); continue;
    }
    p.userData.vel.y -= 6 * dt;
    p.position.x += p.userData.vel.x * dt;
    p.position.y += p.userData.vel.y * dt;
    p.position.z += p.userData.vel.z * dt;
    const lt = p.userData.age / p.userData.life;
    p.material.opacity = 1 - lt;
    p.scale.setScalar(p.userData.initSize * (1 - lt * 0.5));
  }

  // Floating rocks
  for (const r of floatingRocks) {
    r.position.y = r.userData.baseY + Math.sin(game.t * 0.8 + r.userData.bobPhase) * 0.3;
    r.rotation.y += dt * 0.2;
  }

  // Pop text follow + fade
  for (let i = popTexts.length - 1; i >= 0; i--) {
    const t = popTexts[i];
    t.age += dt;
    t.worldPos.y += dt * 1.2;
    if (t.age >= t.life) { t.div.remove(); popTexts.splice(i, 1); continue; }
    const v = t.worldPos.clone().project(camera);
    const x = (v.x * 0.5 + 0.5) * window.innerWidth;
    const y = (-v.y * 0.5 + 0.5) * window.innerHeight;
    t.div.style.left = x + 'px';
    t.div.style.top = y + 'px';
    t.div.style.opacity = (1 - t.age / t.life).toString();
  }

  // Combo decay
  if (game.comboTimer > 0) {
    game.comboTimer -= dt;
    if (game.comboTimer <= 0) game.combo = 1;
  }

  // HUD
  document.getElementById('score').textContent = game.score;
  document.getElementById('combo').textContent = 'x' + game.combo;

  // Toast hide
  if (toastTimer > 0) {
    toastTimer -= dt;
    if (toastTimer <= 0) toastEl.classList.remove('show');
  }

  // Dash ring
  if (uState.dashState === 'window') {
    const pct = uState.dashStateTimer / 0.5;
    ringCircle.setAttribute('stroke-dashoffset', 289 * (1 - pct));
    chargeRing.classList.add('show');
  } else {
    chargeRing.classList.remove('show');
  }
}

// ============================================================
//  START
// ============================================================
const splash = document.getElementById('splash');
const playBtn = document.getElementById('playBtn');
function startGame() {
  splash.classList.add('hidden');
  game.running = true;
}
playBtn.addEventListener('click', startGame);
playBtn.addEventListener('touchend', (e) => { e.preventDefault(); startGame(); }, { passive: false });

requestAnimationFrame(loop);
</script>
</body>
